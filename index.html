<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>👑 ELS BOOK · Fairy Princess Castle</title>
    <style>
        /* ========== RESET & BASE ========== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink-light: #ffe4f0;
            --pink: #ff6bcb;
            --pink-dark: #d94a9e;
            --pink-glow: rgba(255, 107, 203, 0.4);
            --gold: #ffd700;
            --gold-light: #fff0b3;
            --gold-glow: rgba(255, 215, 0, 0.3);
            --lavender: #d4b8ff;
            --lavender-glow: rgba(212, 184, 255, 0.2);
            --text-white: #fff8f5;
            --text-muted: #d4c8d0;
            --card-bg: rgba(255, 255, 255, 0.06);
            --radius: 20px;
            --transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', 'Quicksand', 'Comic Sans MS', cursive, sans-serif;
            background: #1a0a1e;
            color: var(--text-white);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* ========== MAGICAL BACKGROUND ========== */
        #magic-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(255, 107, 203, 0.15) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(212, 184, 255, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 60%),
                linear-gradient(180deg, #1a0a1e 0%, #2d1040 40%, #1f0a2e 100%);
            overflow: hidden;
            pointer-events: none;
        }

        /* ===== CASTLE SILHOUETTE ===== */
        .castle {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            pointer-events: none;
            opacity: 0.12;
        }
        .castle::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 5%;
            width: 90%;
            height: 100%;
            background:
                /* Main wall */
                linear-gradient(180deg, transparent 30%, rgba(255, 215, 0, 0.06) 100%),
                /* Towers */
                radial-gradient(ellipse at 10% 100%, rgba(255, 215, 0, 0.08) 0%, transparent 30%),
                radial-gradient(ellipse at 30% 100%, rgba(255, 215, 0, 0.06) 0%, transparent 25%),
                radial-gradient(ellipse at 50% 100%, rgba(255, 215, 0, 0.08) 0%, transparent 30%),
                radial-gradient(ellipse at 70% 100%, rgba(255, 215, 0, 0.06) 0%, transparent 25%),
                radial-gradient(ellipse at 90% 100%, rgba(255, 215, 0, 0.08) 0%, transparent 30%);
            filter: blur(2px);
        }
        .castle-towers {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            pointer-events: none;
        }
        .castle-towers::before {
            content: '🏰';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12rem;
            opacity: 0.10;
            filter: blur(1px);
        }

        /* ===== FLOATING SPARKLES ===== */
        .sparkle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.8), rgba(255, 107, 203, 0.3));
            animation: float-sparkle var(--dur, 6s) ease-in-out infinite alternate;
            box-shadow: 0 0 20px 4px var(--pink-glow);
        }
        @keyframes float-sparkle {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 0.2;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(30px, -40px) scale(1.4) rotate(180deg);
                opacity: 0.4;
            }
        }

        /* ===== FLOATING STARS ===== */
        .star-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle-star var(--dur, 3s) ease-in-out infinite alternate;
            box-shadow: 0 0 12px 3px rgba(255, 215, 0, 0.3);
        }
        @keyframes twinkle-star {
            0% {
                opacity: 0.1;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* ===== SHOOTING STAR ===== */
        .shooting-star-magic {
            position: absolute;
            width: 3px;
            height: 3px;
            background: linear-gradient(to right, #ffd700, transparent);
            border-radius: 50%;
            animation: shoot-magic linear infinite;
            opacity: 0;
            box-shadow: 0 0 20px 6px rgba(255, 215, 0, 0.3);
        }
        .shooting-star-magic::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 100%;
            width: 80px;
            height: 2px;
            background: linear-gradient(to left, rgba(255, 215, 0, 0.4), transparent);
            transform: translateY(-50%);
        }
        @keyframes shoot-magic {
            0% {
                transform: translate(0, 0) rotate(-30deg);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            20% {
                opacity: 1;
            }
            25% {
                opacity: 0;
                transform: translate(-500px, 350px) rotate(-30deg);
            }
            100% {
                opacity: 0;
            }
        }

        /* ===== LAYOUT ===== */
        .app-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 18px 40px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 215, 0, 0.12);
            box-shadow: 0 8px 40px rgba(255, 107, 203, 0.08), inset 0 0 60px rgba(255, 215, 0, 0.02);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '✨👑✨';
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 4rem;
            opacity: 0.05;
            pointer-events: none;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .header-left .top-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-left .top-row .icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.2));
            animation: float-crown 3s ease-in-out infinite;
        }
        @keyframes float-crown {
            0%,
            100% {
                transform: translateY(0px) rotate(-2deg);
            }
            50% {
                transform: translateY(-6px) rotate(2deg);
            }
        }
        .header-left .top-row h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffd700, #ff6bcb, #d4b8ff, #ffd700);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer-text 4s ease-in-out infinite;
        }
        @keyframes shimmer-text {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        .header-left .credit {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: 52px;
            letter-spacing: 0.5px;
        }
        .header-left .credit span {
            color: var(--pink);
            font-weight: 600;
            text-shadow: 0 0 20px rgba(255, 107, 203, 0.2);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .header-right .badge {
            padding: 6px 18px;
            border-radius: 40px;
            background: rgba(255, 107, 203, 0.12);
            border: 1px solid rgba(255, 107, 203, 0.2);
            font-size: 0.85rem;
            color: var(--pink);
            font-weight: 500;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(255, 107, 203, 0.05);
        }
        .header-right .badge strong {
            color: var(--gold);
            font-weight: 700;
        }

        /* ===== STATS ===== */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 24px;
            padding: 14px 20px;
            margin-bottom: 28px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
        }
        .stats-row .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .stats-row .stat .num {
            color: var(--text-white);
            font-weight: 700;
            font-size: 1.1rem;
        }
        .stats-row .stat .num.gold {
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .stats-row .stat .num.pink {
            color: var(--pink);
            text-shadow: 0 0 20px rgba(255, 107, 203, 0.2);
        }

        /* ===== GRID ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
        }

        /* ===== CARD ===== */
        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius);
            padding: 18px 16px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition);
            cursor: pointer;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.02), rgba(255, 107, 203, 0.02));
            pointer-events: none;
        }

        /* --- NOT ADDED --- */
        .card:not(.added) {
            filter: blur(2px) brightness(0.5) saturate(0.3);
            opacity: 0.5;
            border-color: rgba(255, 255, 255, 0.02);
        }
        .card:not(.added):hover {
            filter: blur(2px) brightness(0.6) saturate(0.4);
            opacity: 0.7;
            transform: scale(1.01);
        }
        .card:not(.added) .card-number {
            color: var(--text-muted);
        }
        .card:not(.added) .card-title {
            color: var(--text-muted);
        }
        .card:not(.added) .card-preview {
            color: rgba(136, 146, 176, 0.2);
        }
        .card:not(.added) .card-status {
            color: rgba(136, 146, 176, 0.2);
        }

        /* --- ADDED: MAGICAL GLOW --- */
        .card.added {
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.03);
            box-shadow:
                0 0 30px rgba(255, 215, 0, 0.04),
                0 0 60px rgba(255, 107, 203, 0.02),
                inset 0 0 60px rgba(255, 215, 0, 0.02);
            animation: card-glow-magic 3s ease-in-out infinite alternate;
        }
        .card.added::after {
            content: '✨';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 1.2rem;
            animation: sparkle-spin 4s linear infinite;
            opacity: 0.3;
        }
        @keyframes sparkle-spin {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.2);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }
        .card.added:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow:
                0 8px 50px rgba(255, 215, 0, 0.08),
                0 0 80px rgba(255, 107, 203, 0.04),
                inset 0 0 40px rgba(255, 215, 0, 0.03);
        }

        @keyframes card-glow-magic {
            0% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.02), 0 0 40px rgba(255, 107, 203, 0.01);
                border-color: rgba(255, 215, 0, 0.15);
            }
            100% {
                box-shadow: 0 0 50px rgba(255, 215, 0, 0.08), 0 0 100px rgba(255, 107, 203, 0.04);
                border-color: rgba(255, 215, 0, 0.35);
            }
        }

        .card.added .card-number {
            color: var(--gold);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .card.added .card-title {
            color: var(--text-white);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }
        .card.added .card-preview {
            color: var(--pink);
            text-shadow: 0 0 20px rgba(255, 107, 203, 0.15);
        }
        .card.added .card-status {
            color: var(--gold-light);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }

        /* Card inner elements */
        .card-number {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-white);
            transition: var(--transition);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-preview {
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.6;
            transition: var(--transition);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 2px;
            flex: 1;
        }
        .card-status {
            margin-top: 10px;
            font-size: 0.7rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            letter-spacing: 0.3px;
        }
        .card-status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: var(--transition);
        }
        .card.added .card-status .dot {
            background: var(--pink);
            box-shadow: 0 0 20px rgba(255, 107, 203, 0.6);
            animation: dot-pulse 1.8s ease-in-out infinite alternate;
        }
        @keyframes dot-pulse {
            0% {
                box-shadow: 0 0 8px rgba(255, 107, 203, 0.3);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 30px rgba(255, 107, 203, 0.8);
                transform: scale(1.3);
            }
        }

        /* 404 overlay */
        .card:not(.added) .card-404 {
            display: flex;
        }
        .card-404 {
            display: none;
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background: rgba(26, 10, 30, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            padding: 12px;
            text-align: center;
        }
        .card:not(.added):active .card-404,
        .card:not(.added):focus .card-404 {
            opacity: 1;
            pointer-events: auto;
        }
        .card-404 .big {
            font-size: 2.4rem;
            line-height: 1;
            color: var(--pink);
            text-shadow: 0 0 30px rgba(255, 107, 203, 0.2);
        }
        .card-404 .sub {
            font-size: 0.7rem;
            opacity: 0.4;
            margin-top: 2px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .header {
                padding: 14px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .header-left .top-row h1 {
                font-size: 1.3rem;
            }
            .header-left .top-row .icon {
                font-size: 1.6rem;
            }
            .header-left .credit {
                font-size: 0.7rem;
                margin-left: 44px;
            }
            .header-right .badge {
                font-size: 0.75rem;
                padding: 4px 14px;
            }
            .stats-row {
                font-size: 0.8rem;
                padding: 10px 14px;
                gap: 10px 16px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .card {
                padding: 14px 12px 12px;
                min-height: 90px;
            }
            .card-title {
                font-size: 0.85rem;
            }
            .card-number {
                font-size: 0.6rem;
            }
            .card-preview {
                font-size: 0.7rem;
            }
            .card-status {
                font-size: 0.6rem;
            }
            .card-404 .big {
                font-size: 1.8rem;
            }
            .castle-towers::before {
                font-size: 6rem;
            }
        }

        @media (max-width: 450px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
            .card {
                padding: 10px 10px 10px;
                min-height: 80px;
            }
            .card-title {
                font-size: 0.75rem;
            }
            .card-preview {
                font-size: 0.65rem;
            }
            .header-left .top-row h1 {
                font-size: 1.1rem;
            }
            .header-left .credit {
                font-size: 0.6rem;
                margin-left: 36px;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a0a1e;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.2);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 215, 0, 0.35);
        }

        ::selection {
            background: var(--pink);
            color: white;
        }
    </style>
</head>
<body>

    <!-- ===== MAGICAL BACKGROUND ===== -->
    <div id="magic-bg" aria-hidden="true">
        <!-- Castle -->
        <div class="castle"></div>
        <div class="castle-towers"></div>
        <!-- Sparkles & stars generated by JS -->
    </div>

    <!-- ===== APP ===== -->
    <div class="app-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="top-row">
                    <span class="icon">👑</span>
                    <h1>ELS BOOK</h1>
                </div>
                <div class="credit">✨ done by <span>nappicoo</span> with love 💕</div>
            </div>
            <div class="header-right">
                <span class="badge">✨ <strong id="addedCount">0</strong> / 200 added</span>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-row">
            <span class="stat">📚 Total texts <span class="num gold">200</span></span>
            <span class="stat">✅ Added <span class="num pink" id="addedStat">0</span></span>
            <span class="stat">⏳ Pending <span class="num" id="pendingStat">200</span></span>
        </div>

        <!-- Grid -->
        <div class="grid" id="textGrid"></div>
    </div>

    <script>
        // ============================================================
        //  ✨ ONE‑TIME SETUP: List the IDs of texts you have created.
        // ============================================================
        const ADDED_TEXTS = [1, 2];   // <-- Add more numbers as you create new texts

        // ============================================================
        //  DATA — all 200 slots
        // ============================================================
        const entries = [];

        for (let i = 0; i < 200; i++) {
            const id = i + 1;
            const isAdded = ADDED_TEXTS.includes(id);
            entries.push({
                id: id,
                title: isAdded ? `Text ${id}` : `Text ${id}`,
                preview: isAdded ? '✨ click to open' : 'coming soon...',
                added: isAdded,
            });
        }

        // ============================================================
        //  RENDER GRID
        // ============================================================
        const grid = document.getElementById('textGrid');
        const addedCountEl = document.getElementById('addedCount');
        const addedStatEl = document.getElementById('addedStat');
        const pendingStatEl = document.getElementById('pendingStat');

        function render() {
            grid.innerHTML = '';
            let addedTotal = 0;

            entries.forEach((entry) => {
                if (entry.added) addedTotal++;

                const card = document.createElement('div');
                card.className = `card ${entry.added ? 'added' : ''}`;
                card.setAttribute('data-id', entry.id);

                const num = document.createElement('div');
                num.className = 'card-number';
                num.textContent = `#${String(entry.id).padStart(3, '0')}`;

                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = entry.title;

                const preview = document.createElement('div');
                preview.className = 'card-preview';
                preview.textContent = entry.preview;

                const status = document.createElement('div');
                status.className = 'card-status';
                const dot = document.createElement('span');
                dot.className = 'dot';
                status.appendChild(dot);
                status.appendChild(document.createTextNode(entry.added ? 'ready' : 'empty'));

                if (!entry.added) {
                    const overlay = document.createElement('div');
                    overlay.className = 'card-404';
                    overlay.innerHTML = `
                        <div class="big">🚀 404</div>
                        <div class="sub">not added yet</div>
                    `;
                    card.appendChild(overlay);
                }

                card.appendChild(num);
                card.appendChild(title);
                card.appendChild(preview);
                card.appendChild(status);

                card.addEventListener('click', function(e) {
                    if (!entry.added) {
                        const overlay = this.querySelector('.card-404');
                        if (overlay) {
                            overlay.style.opacity = '1';
                            overlay.style.pointerEvents = 'auto';
                            setTimeout(() => {
                                overlay.style.opacity = '0';
                                overlay.style.pointerEvents = 'none';
                            }, 1200);
                        }
                    } else {
                        window.location.href = `text${entry.id}.html`;
                    }
                });

                grid.appendChild(card);
            });

            addedCountEl.textContent = addedTotal;
            addedStatEl.textContent = addedTotal;
            pendingStatEl.textContent = 200 - addedTotal;
        }

        render();

        // ============================================================
        //  MAGICAL PARTICLES
        // ============================================================
        function createMagic() {
            const bg = document.getElementById('magic-bg');

            // Sparkles
            for (let i = 0; i < 25; i++) {
                const sp = document.createElement('div');
                sp.className = 'sparkle';
                const size = 3 + Math.random() * 8;
                sp.style.width = size + 'px';
                sp.style.height = size + 'px';
                sp.style.left = Math.random() * 100 + '%';
                sp.style.top = Math.random() * 100 + '%';
                sp.style.setProperty('--dur', (4 + Math.random() * 8) + 's');
                sp.style.animationDelay = (Math.random() * 6) + 's';
                const colors = ['#ffd700', '#ff6bcb', '#d4b8ff', '#ff9ecb', '#fff0b3'];
                sp.style.background = `radial-gradient(circle, ${colors[Math.floor(Math.random() * colors.length)]}, transparent)`;
                sp.style.boxShadow = `0 0 ${20 + Math.random() * 30}px ${3 + Math.random() * 8}px rgba(255,215,0,0.1)`;
                bg.appendChild(sp);
            }

            // Stars
            for (let i = 0; i < 120; i++) {
                const st = document.createElement('div');
                st.className = 'star-particle';
                const size = 1 + Math.random() * 3;
                st.style.width = size + 'px';
                st.style.height = size + 'px';
                st.style.left = Math.random() * 100 + '%';
                st.style.top = Math.random() * 100 + '%';
                st.style.setProperty('--dur', (2 + Math.random() * 5) + 's');
                st.style.animationDelay = (Math.random() * 5) + 's';
                bg.appendChild(st);
            }

            // Shooting stars
            for (let i = 0; i < 5; i++) {
                const ss = document.createElement('div');
                ss.className = 'shooting-star-magic';
                ss.style.left = (10 + Math.random() * 70) + '%';
                ss.style.top = (5 + Math.random() * 40) + '%';
                ss.style.animationDuration = (8 + Math.random() * 12) + 's';
                ss.style.animationDelay = (Math.random() * 25) + 's';
                bg.appendChild(ss);
            }
        }

        createMagic();

        // ============================================================
        //  CONSOLE HELPER (optional)
        // ============================================================
        window.addText = function(id, title, preview) {
            const idx = id - 1;
            if (idx >= 0 && idx < entries.length) {
                entries[idx].title = title || `Text ${id}`;
                entries[idx].preview = preview || '✨ click to open';
                entries[idx].added = true;
                render();
                console.log(`✅ Added text #${id}: "${entries[idx].title}"`);
                return true;
            }
            console.warn('❌ Invalid id (must be between 1 and 200)');
            return false;
        };

        window.__entries = entries;

        console.log('👑 ELS BOOK · Fairy Princess Castle ready!');
        console.log('📖 To add texts, edit the ADDED_TEXTS array at the top of this file.');
        console.log('💕 done by nappicoo with love');
    </script>

</body>
