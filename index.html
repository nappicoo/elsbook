<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>ELS BOOK · by nappicoo</title>
    <style>
        /* ========== RESET & BASE ========== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #0b0f2a;
            --navy-light: #131b44;
            --navy-glow: #1a2a6a;
            --pink: #ff2d95;
            --pink-light: #ff6bcb;
            --pink-glow: rgba(255, 45, 149, 0.5);
            --gold: #ffd700;
            --gold-light: #ffed4a;
            --gold-glow: rgba(255, 215, 0, 0.5);
            --text-white: #f0eef8;
            --text-muted: #8892b0;
            --card-bg: rgba(255, 255, 255, 0.04);
            --radius: 14px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--navy);
            color: var(--text-white);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* ========== SPACE BACKGROUND ========== */
        #space-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(60, 20, 120, 0.30) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(20, 40, 140, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(120, 20, 80, 0.12) 0%, transparent 60%),
                var(--navy);
            overflow: hidden;
            pointer-events: none;
        }

        /* Stars */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.25);
        }
        @keyframes twinkle {
            0% {
                opacity: 0.15;
                transform: scale(0.7);
            }
            100% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* Shooting stars */
        .shooting-star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 14px 5px rgba(255, 255, 255, 0.5);
            animation: shoot linear infinite;
            opacity: 0;
        }
        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 100%;
            width: 70px;
            height: 1.5px;
            background: linear-gradient(to left, rgba(255, 255, 255, 0.5), transparent);
            transform: translateY(-50%);
        }
        @keyframes shoot {
            0% {
                transform: translate(0, 0) rotate(-35deg);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            18% {
                opacity: 1;
            }
            22% {
                opacity: 0;
                transform: translate(-450px, 320px) rotate(-35deg);
            }
            100% {
                opacity: 0;
            }
        }

        /* Sun — gold glow */
        .sun {
            position: absolute;
            bottom: 3%;
            right: 2%;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff7b0, #ffb800 50%, #ff6600);
            box-shadow: 0 0 100px 50px rgba(255, 200, 0, 0.25), 0 0 200px 100px rgba(255, 150, 0, 0.10);
            animation: pulse-sun 5s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulse-sun {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 100px 50px rgba(255, 200, 0, 0.25), 0 0 200px 100px rgba(255, 150, 0, 0.10);
            }
            50% {
                transform: scale(1.06);
                box-shadow: 0 0 130px 70px rgba(255, 200, 0, 0.35), 0 0 240px 130px rgba(255, 150, 0, 0.15);
            }
        }

        /* Moon — navy/pink tint */
        .moon {
            position: absolute;
            top: 6%;
            left: 3%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #f0ece0, #c8c0b0 50%, #a09888);
            box-shadow: 0 0 70px 35px rgba(200, 180, 160, 0.12), inset -12px -12px 30px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            animation: float-moon 7s ease-in-out infinite;
        }
        .moon::before {
            content: '';
            position: absolute;
            top: 18%;
            left: 22%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(160, 150, 135, 0.35);
            box-shadow:
                30px 24px 0 6px rgba(160, 150, 135, 0.28),
                -14px 44px 0 4px rgba(160, 150, 135, 0.22),
                34px 54px 0 8px rgba(160, 150, 135, 0.18);
        }
        @keyframes float-moon {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-14px);
            }
        }

        /* Planets — pink & gold */
        .planet {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .planet-1 {
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 30% 25%, #ff6bcb, #b02a7a);
            top: 12%;
            left: 22%;
            box-shadow: 0 0 40px 15px rgba(255, 107, 203, 0.20);
            animation: orbit1 22s linear infinite;
        }
        .planet-1::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 60%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 12px 8px 0 2px rgba(255, 255, 255, 0.10);
        }
        .planet-2 {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            bottom: 18%;
            right: 15%;
            box-shadow: 0 0 30px 12px rgba(255, 215, 0, 0.15);
            animation: orbit2 26s linear infinite;
        }
        .planet-3 {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 25% 20%, #ff4da6, #a02070);
            top: 48%;
            left: 58%;
            box-shadow: 0 0 30px 12px rgba(255, 45, 149, 0.15);
            animation: orbit3 18s linear infinite;
        }

        @keyframes orbit1 {
            0% {
                transform: rotate(0deg) translateX(140px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(140px) rotate(-360deg);
            }
        }
        @keyframes orbit2 {
            0% {
                transform: rotate(0deg) translateX(90px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(90px) rotate(-360deg);
            }
        }
        @keyframes orbit3 {
            0% {
                transform: rotate(0deg) translateX(110px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(110px) rotate(-360deg);
            }
        }

        /* Galaxy swirl — pink/navy */
        .galaxy {
            position: absolute;
            top: 28%;
            left: 55%;
            width: 460px;
            height: 460px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(255, 45, 149, 0.07), rgba(19, 27, 68, 0.4) 60%, transparent 75%);
            filter: blur(50px);
            pointer-events: none;
            animation: swirl 30s linear infinite;
        }
        @keyframes swirl {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.05);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        /* ========== LAYOUT ========== */
        .app-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 18px 40px;
        }

        /* Header */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            margin-bottom: 8px;
            background: rgba(11, 15, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 215, 0, 0.12);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .header-left .top-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-left .top-row .icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.3));
        }
        .header-left .top-row h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-light), var(--pink-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-left .credit {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: 52px;
            letter-spacing: 0.5px;
        }
        .header-left .credit span {
            color: var(--pink-light);
            font-weight: 500;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .header-right .badge {
            padding: 6px 18px;
            border-radius: 40px;
            background: rgba(255, 45, 149, 0.15);
            border: 1px solid rgba(255, 45, 149, 0.25);
            font-size: 0.85rem;
            color: var(--pink-light);
            font-weight: 500;
            backdrop-filter: blur(4px);
        }
        .header-right .badge strong {
            color: var(--gold);
            font-weight: 700;
        }

        /* Stats row */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 24px;
            padding: 14px 20px;
            margin-bottom: 28px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
        }
        .stats-row .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .stats-row .stat .num {
            color: var(--text-white);
            font-weight: 700;
            font-size: 1.1rem;
        }
        .stats-row .stat .num.gold {
            color: var(--gold);
        }
        .stats-row .stat .num.pink {
            color: var(--pink-light);
        }

        /* ========== GRID ========== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
        }

        /* ========== CARD ========== */
        .card {
            position: relative;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 16px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition);
            cursor: pointer;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* --- NOT ADDED: blurry, muted --- */
        .card:not(.added) {
            filter: blur(3px) brightness(0.55) saturate(0.4);
            opacity: 0.7;
            pointer-events: auto;
            border-color: rgba(255, 255, 255, 0.03);
            transition: var(--transition);
        }
        .card:not(.added):hover {
            filter: blur(3px) brightness(0.65) saturate(0.5);
            opacity: 0.85;
            transform: scale(1.01);
        }
        .card:not(.added) .card-number {
            color: var(--text-muted);
        }
        .card:not(.added) .card-title {
            color: var(--text-muted);
        }
        .card:not(.added) .card-preview {
            color: rgba(136, 146, 176, 0.3);
        }
        .card:not(.added) .card-status {
            color: rgba(136, 146, 176, 0.25);
        }

        /* --- ADDED: glowy, shiny, neon --- */
        .card.added {
            border-color: rgba(255, 215, 0, 0.25);
            background: rgba(255, 215, 0, 0.04);
            box-shadow:
                0 0 25px rgba(255, 215, 0, 0.06),
                inset 0 0 30px rgba(255, 45, 149, 0.03);
            animation: glow-pulse 3s ease-in-out infinite alternate;
            transform: translateY(0);
        }
        .card.added:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow:
                0 8px 40px rgba(255, 215, 0, 0.12),
                0 0 60px rgba(255, 45, 149, 0.06),
                inset 0 0 40px rgba(255, 215, 0, 0.04);
        }

        @keyframes glow-pulse {
            0% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.05), 0 0 40px rgba(255, 45, 149, 0.02);
                border-color: rgba(255, 215, 0, 0.20);
            }
            100% {
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.15), 0 0 80px rgba(255, 45, 149, 0.06);
                border-color: rgba(255, 215, 0, 0.45);
            }
        }

        .card.added .card-number {
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .card.added .card-title {
            color: var(--text-white);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
        }
        .card.added .card-preview {
            color: var(--pink-light);
            text-shadow: 0 0 20px rgba(255, 45, 149, 0.15);
        }
        .card.added .card-status {
            color: var(--gold-light);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        /* Card inner elements */
        .card-number {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-white);
            transition: var(--transition);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-preview {
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
            transition: var(--transition);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 2px;
            flex: 1;
        }
        .card-status {
            margin-top: 10px;
            font-size: 0.7rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            letter-spacing: 0.3px;
        }
        .card-status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: var(--transition);
        }
        .card.added .card-status .dot {
            background: var(--pink);
            box-shadow: 0 0 16px rgba(255, 45, 149, 0.6);
            animation: dot-glow 1.8s ease-in-out infinite alternate;
        }
        @keyframes dot-glow {
            0% {
                box-shadow: 0 0 8px rgba(255, 45, 149, 0.3);
            }
            100% {
                box-shadow: 0 0 24px rgba(255, 45, 149, 0.8);
            }
        }

        /* 404 overlay for not-added click */
        .card:not(.added) .card-404 {
            display: flex;
        }
        .card-404 {
            display: none;
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background: rgba(11, 15, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            padding: 12px;
            text-align: center;
        }
        .card:not(.added):active .card-404,
        .card:not(.added):focus .card-404 {
            opacity: 1;
            pointer-events: auto;
        }
        .card-404 .big {
            font-size: 2.4rem;
            line-height: 1;
            color: var(--pink-light);
            text-shadow: 0 0 30px rgba(255, 45, 149, 0.2);
        }
        .card-404 .sub {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-top: 2px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 700px) {
            .header {
                padding: 14px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .header-left .top-row h1 {
                font-size: 1.3rem;
            }
            .header-left .top-row .icon {
                font-size: 1.5rem;
            }
            .header-left .credit {
                font-size: 0.7rem;
                margin-left: 44px;
            }
            .header-right .badge {
                font-size: 0.75rem;
                padding: 4px 14px;
            }
            .stats-row {
                font-size: 0.8rem;
                padding: 10px 14px;
                gap: 10px 16px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .card {
                padding: 14px 12px 12px;
                min-height: 90px;
            }
            .card-title {
                font-size: 0.85rem;
            }
            .card-number {
                font-size: 0.6rem;
            }
            .card-preview {
                font-size: 0.7rem;
            }
            .card-status {
                font-size: 0.6rem;
            }
            .card-404 .big {
                font-size: 1.8rem;
            }
            .sun {
                width: 80px;
                height: 80px;
                bottom: 1%;
                right: 1%;
            }
            .moon {
                width: 60px;
                height: 60px;
                top: 2%;
                left: 2%;
            }
            .planet-1 {
                width: 20px;
                height: 20px;
                top: 8%;
                left: 18%;
            }
            .planet-2 {
                width: 14px;
                height: 14px;
                bottom: 12%;
                right: 10%;
            }
            .planet-3 {
                width: 16px;
                height: 16px;
                top: 44%;
                left: 50%;
            }
            .galaxy {
                width: 200px;
                height: 200px;
                top: 40%;
                left: 50%;
            }
            .shooting-star {
                display: none;
            }
        }

        @media (max-width: 450px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
            .card {
                padding: 10px 10px 10px;
                min-height: 80px;
            }
            .card-title {
                font-size: 0.75rem;
            }
            .card-preview {
                font-size: 0.65rem;
            }
            .header-left .top-row h1 {
                font-size: 1.1rem;
            }
            .header-left .credit {
                font-size: 0.6rem;
                margin-left: 36px;
            }
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--navy);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.25);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 215, 0, 0.4);
        }

        /* Selection */
        ::selection {
            background: var(--pink);
            color: white;
        }
    </style>
</head>
<body>

    <!-- ===== SPACE BG ===== -->
    <div id="space-bg" aria-hidden="true">
        <div class="sun"></div>
        <div class="moon"></div>
        <div class="planet planet-1"></div>
        <div class="planet planet-2"></div>
        <div class="planet planet-3"></div>
        <div class="galaxy"></div>
    </div>

    <!-- ===== APP ===== -->
    <div class="app-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="top-row">
                    <span class="icon">📖</span>
                    <h1>ELS BOOK</h1>
                </div>
                <div class="credit">✨ done by <span>nappicoo</span> with love 💕</div>
            </div>
            <div class="header-right">
                <span class="badge">✨ <strong id="addedCount">0</strong> / 200 added</span>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-row">
            <span class="stat">📚 Total texts <span class="num gold">200</span></span>
            <span class="stat">✅ Added <span class="num pink" id="addedStat">0</span></span>
            <span class="stat">⏳ Pending <span class="num" id="pendingStat">200</span></span>
        </div>

        <!-- Grid -->
        <div class="grid" id="textGrid"></div>
    </div>

    <script>
        // ============================================================
        //  DATA — all 200 slots are empty (404) by default
        //  You add texts using addText(id, title, preview)
        // ============================================================
        const entries = [];

        // Fill all 200 slots as empty
        for (let i = 0; i < 200; i++) {
            entries.push({
                id: i + 1,
                title: `Text ${i + 1}`,
                preview: 'coming soon...',
                added: false,
            });
        }

        // ============================================================
        //  RENDER GRID
        // ============================================================
        const grid = document.getElementById('textGrid');
        const addedCountEl = document.getElementById('addedCount');
        const addedStatEl = document.getElementById('addedStat');
        const pendingStatEl = document.getElementById('pendingStat');

        function render() {
            grid.innerHTML = '';
            let addedTotal = 0;

            entries.forEach((entry) => {
                if (entry.added) addedTotal++;

                const card = document.createElement('div');
                card.className = `card ${entry.added ? 'added' : ''}`;
                card.setAttribute('data-id', entry.id);

                const num = document.createElement('div');
                num.className = 'card-number';
                num.textContent = `#${String(entry.id).padStart(3, '0')}`;

                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = entry.title;

                const preview = document.createElement('div');
                preview.className = 'card-preview';
                preview.textContent = entry.preview;

                const status = document.createElement('div');
                status.className = 'card-status';
                const dot = document.createElement('span');
                dot.className = 'dot';
                status.appendChild(dot);
                status.appendChild(document.createTextNode(entry.added ? 'ready' : 'empty'));

                if (!entry.added) {
                    const overlay = document.createElement('div');
                    overlay.className = 'card-404';
                    overlay.innerHTML = `
                        <div class="big">🚀 404</div>
                        <div class="sub">not added yet</div>
                    `;
                    card.appendChild(overlay);
                }

                card.appendChild(num);
                card.appendChild(title);
                card.appendChild(preview);
                card.appendChild(status);

                // ============================================================
                //  CLICK HANDLER — NAVIGATES TO textX.html (AUTOMATIC)
                // ============================================================
                card.addEventListener('click', function(e) {
                    if (!entry.added) {
                        // Show 404 overlay for empty cards
                        const overlay = this.querySelector('.card-404');
                        if (overlay) {
                            overlay.style.opacity = '1';
                            overlay.style.pointerEvents = 'auto';
                            setTimeout(() => {
                                overlay.style.opacity = '0';
                                overlay.style.pointerEvents = 'none';
                            }, 1200);
                        }
                    } else {
                        // 🚀 AUTOMATICALLY OPEN text1.html, text2.html, etc.
                        // This line handles all 200 files dynamically!
                        window.location.href = `text${entry.id}.html`;
                    }
                });

                grid.appendChild(card);
            });

            addedCountEl.textContent = addedTotal;
            addedStatEl.textContent = addedTotal;
            pendingStatEl.textContent = 200 - addedTotal;
        }

        render();

        // ============================================================
        //  GENERATE STARS & SHOOTING STARS
        // ============================================================
        function createStars() {
            const bg = document.getElementById('space-bg');
            const count = 180;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = 1.5 + Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                bg.appendChild(star);
            }
        }

        function createShootingStars() {
            const bg = document.getElementById('space-bg');
            for (let i = 0; i < 4; i++) {
                const ss = document.createElement('div');
                ss.className = 'shooting-star';
                ss.style.left = (10 + Math.random() * 70) + '%';
                ss.style.top = (5 + Math.random() * 40) + '%';
                ss.style.animationDuration = (6 + Math.random() * 10) + 's';
                ss.style.animationDelay = (Math.random() * 20) + 's';
                ss.style.width = (2 + Math.random() * 3) + 'px';
                ss.style.height = ss.style.width;
                bg.appendChild(ss);
            }
        }

        createStars();
        createShootingStars();

        // ============================================================
        //  ADD NEW ENTRIES — use this to add your texts daily!
        //  Usage: addText(6, 'The Golden Voyage', 'Sailing through the stars...')
        // ============================================================
        window.addText = function(id, title, preview) {
            const idx = id - 1;
            if (idx >= 0 && idx < entries.length) {
                entries[idx].title = title;
                entries[idx].preview = preview;
                entries[idx].added = true;
                render();
                console.log(`✅ Added text #${id}: "${title}"`);
                return true;
            }
            console.warn('❌ Invalid id (must be between 1 and 200)');
            return false;
        };

        window.__entries = entries;

        console.log('🌌 ELS BOOK ready!');
        console.log('📖 Use addText(id, title, preview) to add your texts.');
        console.log('✨ Example: addText(1, "The Best Recruiting Agents", "Reading passage about recruiting agents")');
        console.log('💕 done by nappicoo with love');
        console.log('🚀 Clicking any added card opens textX.html automatically!');
    </script>

</body>
</html>
